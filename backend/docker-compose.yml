version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:


services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Senha123!
      MYSQL_DATABASE: test_project
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker
    restart: always
    env_file:
      - .env
    command: [ "node", "dist/queue/orderWorker.js" ]
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - app-network
